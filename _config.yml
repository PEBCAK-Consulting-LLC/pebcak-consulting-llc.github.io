# Site settings
title: PEBCAK Consulting LLC
email: sonofagl1tch@pebcakconsulting.com
description: >-
  Professional consulting services and technical insights.
baseurl: ""
url: "https://pebcak-consulting-llc.github.io"

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Header pages order
header_pages:
  - index.md
  - blog.md
  - speaking.md
  - presentations.md
  - about.md

# Security settings
webrick:
  headers:
    Content-Security-Policy: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' mailto:; object-src 'none'; media-src 'self';"
    X-Frame-Options: "DENY"
    X-Content-Type-Options: "nosniff"
    X-XSS-Protection: "1; mode=block"
    Referrer-Policy: "strict-origin-when-cross-origin"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - "*.log"
  - "*.tmp"
  - ".env*"
  - ".DS_Store"
